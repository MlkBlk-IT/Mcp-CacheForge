[project]
name = "icycache"
version = "0.3.0"
description = "IcyCache - passerelle LLM universelle avec cache local. I see cache, I burn cache."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MlkBlk-IT" }]
keywords = [
    "mcp",
    "mcp-server",
    "llm",
    "llm-proxy",
    "cache",
    "semantic-cache",
    "fastapi",
    "local-llm",
    "token-economy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27,<1",
    "sse-starlette>=2.1",
    # Requis par uvicorn pour servir /ws/events (deltas live + evenement final).
    # Sans lui, l'import passe mais la WebSocket est refusee a l'execution.
    "websockets>=12.0",
    "pydantic>=2.9",
    # Borne superieure obligatoire : dans mcp 2.x, FastMCP a ete renomme
    # MCPServer et `mcp.server.fastmcp` n'existe plus. Le code utilise
    # l'API v1 (cf. requirements.txt : mcp==1.30.0).
    "mcp>=1.2.0,<2",
    "pyahocorasick>=2.1",
    "nltk>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
# Icone de tray (Windows): `tray.py` du depot.
tray = [
    "pystray>=0.19",
    "pillow>=10.0",
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
icycache = "icycache.cli:main"

[project.urls]
Homepage = "https://github.com/MlkBlk-IT/icycache"
Repository = "https://github.com/MlkBlk-IT/icycache"
Issues = "https://github.com/MlkBlk-IT/icycache/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/scratch",
    "/db",
    "/logs",
    "/venv",
    "/.pytest_cache",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.bak",
    "**/*.bak-*",
    "**/*.bak_*",
]

# Le paquet installe reproduit la disposition du depot :
#   icycache/src/   -> les modules (imports a plat, comme dans le depot)
#   icycache/config/ -> les configs JSON
#   icycache/static/ -> le dashboard et three.js
# PROJECT_ROOT (parent de src/) pointe donc au bon endroit dans les deux modes.
[tool.hatch.build.targets.wheel]
packages = ["icycache"]

[tool.hatch.build.targets.wheel.force-include]
"src" = "icycache/src"
"config" = "icycache/config"
"static" = "icycache/static"

[tool.hatch.build.targets.sdist]
include = [
    "/icycache",
    "/src",
    "/config",
    "/static",
    "/tests",
    "/tools",
    "/docs",
    "/README.md",
    "/PROGRESS.md",
    "/UPDATE-NOTES.md",
    "/LICENSE",
    "/pyproject.toml",
    "/requirements.txt",
    "/tray.py",
    "/mcp_stdio.py",
    "/entrypoint.sh",
    "/warmup_cache.py",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
