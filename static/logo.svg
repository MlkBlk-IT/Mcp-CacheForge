<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CacheForge logo">
  <defs>
    <linearGradient id="lgEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ffa8"/>
      <stop offset="30%" stop-color="#22e6ff"/>
      <stop offset="58%" stop-color="#c56bff"/>
      <stop offset="82%" stop-color="#ff3d63"/>
      <stop offset="100%" stop-color="#ffe055"/>
    </linearGradient>
    <linearGradient id="lgBolt" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe055"/>
      <stop offset="100%" stop-color="#ff3d63"/>
    </linearGradient>
    <radialGradient id="lgCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22e6ff" stop-opacity=".55"/>
      <stop offset="52%" stop-color="#c56bff" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#22e6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="lgBloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="29" fill="url(#lgCore)"/>

  <!-- neural orbit ring -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="url(#lgEdge)" stroke-width="1.3"
          stroke-opacity=".5" stroke-linecap="round" stroke-dasharray="3.5 6.5"/>

  <!-- forge hexagon -->
  <path d="M32 4.5 L55.5 18 L55.5 46 L32 59.5 L8.5 46 L8.5 18 Z" fill="rgba(5,9,20,.55)"
        stroke="url(#lgEdge)" stroke-width="2.6" stroke-linejoin="round" filter="url(#lgBloom)"/>
  <path d="M32 12 L48.5 21.5 L48.5 42.5 L32 52 L15.5 42.5 L15.5 21.5 Z" fill="none"
        stroke="url(#lgEdge)" stroke-width=".9" stroke-opacity=".5" stroke-linejoin="round"/>

  <!-- neuron arbor -->
  <g stroke="#39ffa8" stroke-width="1.3" stroke-linecap="round" stroke-opacity=".65" fill="none">
    <path d="M32 32 L17.5 20.5"/><path d="M32 32 L17.5 43.5"/>
    <path d="M32 32 L46.5 20.5"/><path d="M32 32 L46.5 43.5"/>
  </g>
  <g fill="#22e6ff">
    <circle cx="17.5" cy="20.5" r="2.1"/>
    <circle cx="46.5" cy="43.5" r="2.1"/>
  </g>
  <g fill="#c56bff">
    <circle cx="46.5" cy="20.5" r="1.7"/>
    <circle cx="17.5" cy="43.5" r="1.7"/>
  </g>

  <!-- forge bolt -->
  <path d="M35.5 12 L20 35.5 L29.5 35.5 L27 52 L44 27 L33.5 27 Z" fill="url(#lgBolt)" filter="url(#lgBloom)"/>

  <!-- orbiting sparks -->
  <circle cx="32" cy="4.5" r="2.4" fill="#22e6ff" filter="url(#lgBloom)"/>
  <circle cx="32" cy="59.5" r="1.9" fill="#ff3d63" filter="url(#lgBloom)"/>
</svg>
